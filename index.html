<head>

    <!-- 2. Carrega a fonte Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- 3. Carrega o Font Awesome (para ícones estáveis) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" xintegrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A==" crossorigin="anonymous" referrerpolicy="no-referrer" />

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.6.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.6.0/firebase-database-compat.js"></script>
    
    <!-- Inicialização do Firebase -->
    <script>
        // Configuração do Firebase
        const firebaseConfig = {
            databaseURL: "https://rastreio-marc35-default-rtdb.firebaseio.com"
        };

        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);
        
        // Referência para o banco de dados
        const db = firebase.database();

        // Funções para interagir com o Firebase
        const firebaseService = {
            // Salvar um novo rastreio
            async saveRastreio(rastreioData) {
                try {
                    const newRastreioRef = db.ref('rastreios').push();
                    await newRastreioRef.set({
                        ...rastreioData,
                        createdAt: firebase.database.ServerValue.TIMESTAMP
                    });
                    return { success: true, id: newRastreioRef.key };
                } catch (error) {
                    console.error('Erro ao salvar rastreio:', error);
                    return { success: false, error };
                }
            },

            // Buscar todos os rastreios
            async getAllRastreios() {
                try {
                    const snapshot = await db.ref('rastreios').once('value');
                    return snapshot.val() || {};
                } catch (error) {
                    console.error('Erro ao buscar rastreios:', error);
                    return {};
                }
            },

            // Atualizar um rastreio
            async updateRastreio(rastreioId, updateData) {
                try {
                    await db.ref(`rastreios/${rastreioId}`).update({
                        ...updateData,
                        updatedAt: firebase.database.ServerValue.TIMESTAMP
                    });
                    return { success: true };
                } catch (error) {
                    console.error('Erro ao atualizar rastreio:', error);
                    return { success: false, error };
                }
            },

            // Deletar um rastreio
            async deleteRastreio(rastreioId) {
                try {
                    await db.ref(`rastreios/${rastreioId}`).remove();
                    return { success: true };
                } catch (error) {
                    console.error('Erro ao deletar rastreio:', error);
                    return { success: false, error };
                }
            },

            // Escutar mudanças em tempo real
            listenToRastreios(callback) {
                db.ref('rastreios').on('value', (snapshot) => {
                    const data = snapshot.val() || {};
                    callback(data);
                });
            }
        };
    </script>

    <!-- 4. Favicon temático (caixa) -->

    <style>

            transform: scale(0.95);
        }

            opacity: 1;

        .modal-fade-leave {

    </style>
</head>

    <!-- 4. JavaScript da Aplicação -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {

            // --- Seletores do DOM ---
            const purchaseList = document.getElementById('purchase-list');
            const emptyState = document.getElementById('empty-state');
            const modal = document.getElementById('purchase-modal');
            const form = document.getElementById('purchase-form');
            const modalTitle = document.getElementById('modal-title');
            const editIdInput = document.getElementById('edit-id');
            const openModalBtn = document.getElementById('open-modal-btn');
            const closeModalBtn = document.getElementById('close-modal-btn');
            const cancelBtn = document.getElementById('cancel-btn');
            const filterContainer = document.getElementById('filter-container');
            const toast = document.getElementById('toast');
            const toastMessage = document.getElementById('toast-message');

            // --- Variáveis de Estado ---
            let state = {
                purchases: [], // Array principal de dados
                filter: 'todos', // Filtro atual
            };
            const STORAGE_KEY = 'my_local_purchases';

            // --- Funções Principais ---

            /**
             * Inicializa a aplicação
             */
            async function init() {
                await loadPurchasesFromStorage();
                addEventListeners();
                
                // Escuta mudanças em tempo real
                db.ref('purchases').on('value', (snapshot) => {
                    const data = snapshot.val();
                    state.purchases = data ? Object.values(data) : [];
                    sortPurchases();
                    renderList();
                });
            }

            /**
             * Carrega os dados do Firebase para o estado
             */
            async function loadPurchasesFromStorage() {
                try {
                    const snapshot = await db.ref('purchases').once('value');
                    const data = snapshot.val();
                    state.purchases = data ? Object.values(data) : [];
                    sortPurchases(); // Ordena ao carregar
                    renderList(); // Atualiza a interface
                } catch (error) {
                    console.error('Erro ao carregar compras:', error);
                    showToast('Erro ao carregar compras', 'bg-red-500');
                }
            }

            /**
             * Salva o estado atual no Firebase
             */
            async function savePurchasesToStorage() {
                try {
                    const purchasesObject = {};
                    state.purchases.forEach(purchase => {
                        purchasesObject[purchase.id] = purchase;
                    });
                    await db.ref('purchases').set(purchasesObject);
                } catch (error) {
                    console.error('Erro ao salvar compras:', error);
                    showToast('Erro ao salvar compras', 'bg-red-500');
                }
            }

            /**
             * Renderiza a lista de compras na tela
             */
            function renderList() {
                purchaseList.innerHTML = '';

                // Verifica e atualiza status de atraso antes de renderizar
                const statusChanged = checkAndUpdateStatus();
                if (statusChanged) {
                    sortPurchases(); // Re-ordena se o status mudou (ex: Atrasado)
                    savePurchasesToStorage(); // Salva se algum status mudou
                }

                const filteredPurchases = state.purchases.filter(item => {
                    if (state.filter === 'todos') return true;
                    return item.status === state.filter;
                });

                if (state.purchases.length === 0) {
                    emptyState.classList.remove('hidden');
                    purchaseList.classList.add('hidden');
                } else {
                    emptyState.classList.add('hidden');
                    purchaseList.classList.remove('hidden');
                }

                filteredPurchases.forEach(item => {
                    const card = createPurchaseCard(item);
                    purchaseList.innerHTML += card;
                });
            }

            /**
             * Verifica se alguma compra está atrasada e atualiza o status
             * Também reverte o status se a data for corrigida
             * @returns {boolean} - Retorna true se algum status foi alterado
             */
            function checkAndUpdateStatus() {
                const today = getTodayDate(); // CORREÇÃO: Usa a data local
                let statusChanged = false;

                state.purchases.forEach(item => {
                    const isOverdue = item.deliveryDate < today;
                    const isFinalStatus = item.status === 'Entregue' || item.status === 'Cancelado';

                    // LÓGICA 1: Se deve ser marcado como Atrasado
                    if (isOverdue && !isFinalStatus) {
                        if (item.status !== 'Atrasado') {
                            item.status = 'Atrasado';
                            statusChanged = true;
                        }
                    // LÓGICA 2: Se estava Atrasado, mas a data foi corrigida para hoje ou futuro
                    } else if (item.status === 'Atrasado' && !isOverdue) {
                        // Reverte para um status seguro
                        item.status = 'Aguardando Envio'; 
                        statusChanged = true;
                    }
                });
                return statusChanged;
            }

            /**
             * Cria o HTML para um card de compra (DESIGN REVITALIZADO)
             * @param {object} item - O objeto da compra
             * @returns {string} - O HTML do card
             */
            function createPurchaseCard(item) {
                // Info de Status (para o badge)

                let purchaseDaysText = ''; // Texto principal

                return `

                            <div class="flex justify-between items-start mb-4">
                                <div class="flex items-center gap-3">
                                    <div class="flex-shrink-0 w-8 h-8">${categoryIcon}</div>
                                    <div class="flex-1 min-w-0">
                                        <h3 class="text-lg font-bold text-gray-800 leading-tight truncate" title="${escapeHTML(item.name)}">${escapeHTML(item.name)}</h3>
                                        ${storeHTML}
                                    </div>
                                </div>
                                <!-- Badge de Status -->
                                <span class="text-xs font-bold px-2.5 py-1 rounded-full ${statusClass} whitespace-nowrap ml-2">
                                    ${escapeHTML(statusText)}
                                </span>
                            </div>
                            
                            <!-- Corpo do Card (Contadores) -->
                            <div class="grid grid-cols-2 gap-4 my-5 px-1">
                                <!-- Lado Esquerdo: Countdown de Entrega -->
                                <div class="border-r border-gray-200 pr-4">
                                    <label class="text-xs text-gray-500 uppercase font-medium">Entrega</label>
                                    <p class="text-2xl font-extrabold ${deliveryColorClass}">${deliveryTimeHTML}</p>
                                    <p class="text-sm text-gray-600">${deliveryDate}</p>

            /**
             * Adiciona todos os event listeners da aplicação
             */
            function addEventListeners() {
                // Event listeners existentes
                openModalBtn.addEventListener('click', () => openModal());
                closeModalBtn.addEventListener('click', closeModal);
                cancelBtn.addEventListener('click', closeModal);
                modal.addEventListener('click', (e) => {
                    if (e.target === modal) {
                        closeModal();
                    }
                });
                form.addEventListener('submit', handleFormSubmit);
                purchaseList.addEventListener('click', handleListActions);
                filterContainer.addEventListener('click', handleFilterClick);

                // Event listeners para backup/restore
                document.getElementById('backup-btn').addEventListener('click', createBackup);
                document.getElementById('restore-btn').addEventListener('click', openRestoreModal);
                document.getElementById('close-restore-modal-btn').addEventListener('click', closeRestoreModal);
                
                // Fecha o modal de restauração ao clicar fora
                document.getElementById('restore-modal').addEventListener('click', (e) => {
                    if (e.target.id === 'restore-modal') {
                        closeRestoreModal();
                    }
                });

                // Handler para botões de restaurar e excluir backup
                document.getElementById('backups-list').addEventListener('click', async (e) => {
                    const button = e.target.closest('button[data-action]');
                    if (!button) return;

                    const action = button.dataset.action;
                    const backupId = button.dataset.id;

                    if (action === 'restore') {
                        try {
                            if (!confirm('Tem certeza que deseja restaurar este backup? Os dados atuais serão substituídos.')) {
                                return;
                            }
                            const snapshot = await db.ref(`backups/${backupId}`).once('value');
                            const backup = snapshot.val();
                            if (!backup || !backup.data) throw new Error('Backup inválido');
                            await db.ref('purchases').set(backup.data);
                            closeRestoreModal();
                            showToast('Backup restaurado com sucesso!', 'bg-green-500');
                        } catch (error) {
                            console.error('Erro ao restaurar backup:', error);
                            showToast('Erro ao restaurar backup', 'bg-red-500');
                        }
                    } else if (action === 'delete') {
                        try {
                            if (!confirm('Tem certeza que deseja excluir este backup?')) {
                                return;
                            }
                            await db.ref(`backups/${backupId}`).remove();
                            showToast('Backup excluído com sucesso!', 'bg-red-500');
                            openRestoreModal(); // Recarrega a lista
                        } catch (error) {
                            console.error('Erro ao excluir backup:', error);
                            showToast('Erro ao excluir backup', 'bg-red-500');
                        }
                    }
                });
            }

            /**
             * Manipula o envio do formulário (Cria ou Atualiza)
             */
            async function handleFormSubmit(e) {
                e.preventDefault();

                // Lógica para ler o novo seletor de ícone (radio)
                const selectedIcon = document.querySelector('input[name="item-icon-radio"]:checked');
                
                const formData = {
                    name: document.getElementById('item-name').value.trim(),
                    store: document.getElementById('store-name').value.trim(),
                    purchaseDate: document.getElementById('purchase-date').value,
                    deliveryDate: document.getElementById('delivery-date').value,
                    status: document.getElementById('item-status').value,
                    trackingCode: document.getElementById('tracking-code').value.trim(),
                    icon: selectedIcon ? selectedIcon.value : 'caixa', // Pega o valor do radio
                };
                
                const editId = editIdInput.value;

                if (editId) {
                    // LÓGICA DE ATUALIZAÇÃO DE STATUS
                    const today = getTodayDate();
                    const isOverdue = formData.deliveryDate < today;
                    const isFinalStatus = formData.status === 'Entregue' || formData.status === 'Cancelado';

                    if (isOverdue && !isFinalStatus) {
                        formData.status = 'Atrasado'; 
                    } else if (formData.status === 'Atrasado' && !isOverdue) {
                        formData.status = 'Aguardando Envio';
                    }
                    // Atualiza o select do status no formulário caso tenha mudado
                    document.getElementById('item-status').value = formData.status;

                    const index = state.purchases.findIndex(item => item.id === editId);
                    if (index !== -1) {
                        state.purchases[index] = { 
                            ...state.purchases[index], 
                            ...formData,
                            updatedAt: firebase.database.ServerValue.TIMESTAMP 
                        };
                        await savePurchasesToStorage();
                        showToast('Compra atualizada com sucesso!');
                    }
                } else {
                    const newItem = {
                        id: Date.now().toString(),
                        ...formData,
                        createdAt: firebase.database.ServerValue.TIMESTAMP
                    };
                    state.purchases.push(newItem);
                    await savePurchasesToStorage();
                    showToast('Compra adicionada com sucesso!');
                }

                sortPurchases(); // Ordena a lista
                closeModal();
            }

            /**
             * (*** ATUALIZADO ***)
             * Manipula cliques na lista (Editar/Excluir/Entregue)
             */
            async function handleListActions(e) {
                const target = e.target;
                const editBtn = target.closest('.edit-btn');
                const deleteBtn = target.closest('.delete-btn');
                const deliverBtn = target.closest('.deliver-btn'); // NOVO

                if (editBtn) {
                    const id = editBtn.dataset.id;
                    const item = state.purchases.find(p => p.id === id);
                    if (item) {
                        openModal(item); 
                    }
                }

                if (deleteBtn) {
                    const id = deleteBtn.dataset.id;
                    state.purchases = state.purchases.filter(p => p.id !== id);
                    try {
                        await savePurchasesToStorage();
                        showToast('Compra excluída.', 'bg-red-500');
                    } catch (error) {
                        console.error('Erro ao excluir compra:', error);
                        showToast('Erro ao excluir compra', 'bg-red-500');
                    }
                }

                // (NOVO) Manipulador do botão "Entregue"
                if (deliverBtn) {
                    const id = deliverBtn.dataset.id;
                    const index = state.purchases.findIndex(p => p.id === id);
                    if (index !== -1) {
                        state.purchases[index].status = 'Entregue';
                        state.purchases[index].updatedAt = firebase.database.ServerValue.TIMESTAMP;
                        sortPurchases(); // Re-ordena (item vai para o fim)
                        try {
                            await savePurchasesToStorage();
                            showToast('Compra marcada como entregue!', 'bg-green-500');
                        } catch (error) {
                            console.error('Erro ao marcar como entregue:', error);
                            showToast('Erro ao marcar como entregue', 'bg-red-500');
                        }
                    }
                }
            }
            
            /**
             * Manipula o clique nos botões de filtro (pills)
             */
            function handleFilterClick(e) {
                const target = e.target.closest('button.filter-pill');
                
                if (!target) return;

                const newFilter = target.dataset.filter;

                if (newFilter === state.filter) return;

                state.filter = newFilter;

                const buttons = filterContainer.querySelectorAll('button.filter-pill');
                
                const inactiveClasses = ['bg-white', 'text-gray-600', 'border-gray-200', 'hover:bg-gray-50', 'hover:shadow-sm'];
                const classesToRemove = [
                    'bg-teal-600', 'text-white', 'border-transparent', 'shadow',
                    'bg-green-100', 'text-green-800',
                    'bg-cyan-100', 'text-cyan-800', 'font-bold',
                    'bg-orange-100', 'text-orange-800', 'font-bold', // Atualizado para Laranja
                    'bg-red-100', 'text-red-800',
                    'bg-purple-100', 'text-purple-800', 'font-bold'
                ];

                buttons.forEach(btn => {
                    btn.classList.remove(...classesToRemove);
                    btn.classList.add(...inactiveClasses);
                });

                target.classList.remove(...inactiveClasses);
                
                if (newFilter === 'todos') {
                    target.classList.add('bg-teal-600', 'text-white', 'border-transparent', 'shadow');
                } else {
                    // Usa a classe do badge para colorir o filtro
                    const { statusClass } = getStatusInfo(newFilter);
                    target.classList.add(...statusClass.split(' '), 'border-transparent', 'shadow');
                }
                
                renderList();
            }

            /**
             * Abre o modal.
             */
            function openModal(item = null) {
                form.reset(); 

                if (item) {
                    modalTitle.textContent = 'Editar Compra';
                    editIdInput.value = item.id;
                    document.getElementById('item-name').value = item.name;
                    document.getElementById('store-name').value = item.store;
                    document.getElementById('purchase-date').value = item.purchaseDate;
                    document.getElementById('delivery-date').value = item.deliveryDate;
                    document.getElementById('item-status').value = item.status;
                    document.getElementById('tracking-code').value = item.trackingCode;

            /**
             * Fecha o modal e reseta o formulário
             */
            function closeModal() {
                modal.classList.add('modal-fade-leave-active');
                modal.classList.remove('modal-fade-enter-active');
                
                setTimeout(() => {
                    modal.classList.add('hidden');
                    modal.classList.remove('modal-fade-leave-active');
                    modal.classList.add('modal-fade-enter');
                    form.reset();
                    editIdInput.value = '';
                }, 200); 
            }

            /**
             * Cria um backup dos dados atuais diretamente no Firebase
             */
            async function createBackup() {
                try {
                    // Obtém os dados atuais
                    const snapshot = await db.ref('purchases').once('value');
                    const data = snapshot.val();
                    
                    // Cria o objeto de backup com metadata
                    const backup = {
                        data: data || {},
                        timestamp: firebase.database.ServerValue.TIMESTAMP,
                        version: '1.0',
                        date: new Date().toISOString()
                    };
                    
                    // Salva o backup no Firebase
                    await db.ref('backups').push(backup);
                    
                    showToast('Backup criado com sucesso!', 'bg-blue-500');
                } catch (error) {
                    console.error('Erro ao criar backup:', error);
                    showToast('Erro ao criar backup', 'bg-red-500');
                }
            }

            /**
             * Abre o modal de restauração e carrega a lista de backups
             */
            async function openRestoreModal() {
                const restoreModal = document.getElementById('restore-modal');
                const backupsList = document.getElementById('backups-list');
                const noBackups = document.getElementById('no-backups');
                
                try {
                    // Busca todos os backups
                    const snapshot = await db.ref('backups').orderByChild('timestamp').once('value');
                    const backups = snapshot.val();
                    
                    if (!backups) {
                        backupsList.innerHTML = '';
                        noBackups.classList.remove('hidden');
                        backupsList.classList.add('hidden');
                    } else {
                        noBackups.classList.add('hidden');
                        backupsList.classList.remove('hidden');
                        
                        // Converte o objeto em array e reverte para mostrar mais recentes primeiro
                        const backupsArray = Object.entries(backups).reverse();
                        
                        backupsList.innerHTML = backupsArray.map(([key, backup]) => {
                            const date = new Date(backup.timestamp).toLocaleString();
                            const itemCount = Object.keys(backup.data || {}).length;
                            
                            return `
                                <div class="bg-gray-50 rounded-lg p-4 flex items-center justify-between">
                                    <div>
                                        <div class="font-medium text-gray-900">Backup de ${date}</div>
                                        <div class="text-sm text-gray-500">${itemCount} ${itemCount === 1 ? 'item' : 'itens'}</div>
                                    </div>
                                    <div class="flex gap-2">
                                        <button 
                                            data-action="restore"
                                            data-id="${key}"
                                            class="flex items-center gap-2 px-4 py-2 bg-purple-500 text-white rounded-lg hover:bg-purple-600 transition-colors">
                                            <i class="fa-solid fa-clock-rotate-left w-4 h-4"></i>
                                            Restaurar
                                        </button>
                                        <button 
                                            data-action="delete"
                                            data-id="${key}"
                                            class="flex items-center gap-2 px-4 py-2 bg-red-500 text-white rounded-lg hover:bg-red-600 transition-colors">
                                            <i class="fa-solid fa-trash w-4 h-4"></i>
                                        </button>
                                    </div>
                                </div>
                            `;
                        }).join('');
                    }
                    
                    // Mostra o modal
                    restoreModal.classList.remove('hidden');
                    requestAnimationFrame(() => {
                        restoreModal.classList.add('modal-fade-enter-active');
                        restoreModal.classList.remove('modal-fade-enter');

                    console.error('Erro ao carregar backups:', error);
                    showToast('Erro ao carregar backups', 'bg-red-500');

            /**
             * Restaura um backup específico
             */
            async function restoreBackup(backupId) {
                try {
                    // Confirma com o usuário
                    if (!confirm('Tem certeza que deseja restaurar este backup? Os dados atuais serão substituídos.')) {
                        return;
                    }
                    
                    // Busca o backup
                    const snapshot = await db.ref(`backups/${backupId}`).once('value');
                    const backup = snapshot.val();
                    
                    if (!backup || !backup.data) {
                        throw new Error('Backup inválido');
                    }
                    
                    // Restaura os dados
                    await db.ref('purchases').set(backup.data);
                    
                    // Fecha o modal
                    closeRestoreModal();
                    
                    showToast('Backup restaurado com sucesso!', 'bg-green-500');
                } catch (error) {
                    console.error('Erro ao restaurar backup:', error);
                    showToast('Erro ao restaurar backup', 'bg-red-500');

                restoreModal.classList.remove('modal-fade-enter-active');

                    restoreModal.classList.add('modal-fade-enter');
                }, 200);

            // --- Funções Utilitárias ---

            /**
             * Retorna a data local de hoje no formato YYYY-MM-DD
             */
            function getTodayDate() {
                const today = new Date();
                const year = today.getFullYear();
                const month = (today.getMonth() + 1).toString().padStart(2, '0'); // Mês é 0-indexado
                const day = today.getDate().toString().padStart(2, '0');
                return `${year}-${month}-${day}`;
            }

            /**
             * Ordena a lista por prioridade de status e data
             */
            function sortPurchases() {
                const getStatusPriority = (status) => {
                    switch (status) {
                        case 'Atrasado': return 1; // Mais importante
                        case 'Em Trânsito': return 2;
                        case 'Aguardando Envio': return 3;
                        case 'Entregue': return 4;
                        case 'Cancelado': return 5;
                        default: return 6;
                    }
                };

                state.purchases.sort((a, b) => {
                    const priorityA = getStatusPriority(a.status);
                    const priorityB = getStatusPriority(b.status);

                    // 1. Ordena por prioridade de status
                    if (priorityA !== priorityB) {
                        return priorityA - priorityB;
                    }

                    // 2. Se a prioridade for a mesma:
                    // Para itens ativos (prioridade < 4), ordena pela data de entrega mais próxima (ascendente)
                    if (priorityA < 4) { 
                        return new Date(a.deliveryDate) - new Date(b.deliveryDate);
                    } else {
                    // Para itens finalizados (Entregue, Cancelado), ordena pela data mais recente (descendente)
                        return new Date(b.deliveryDate) - new Date(a.deliveryDate);
                    }
                });
            }

            /**
             * Calcula a diferença de dias (Date1 - Date2)
             */
            function calculateDaysDifference(dateStr1, dateStr2) {
                const date1 = new Date(dateStr1 + 'T00:00:00');
                const date2 = new Date(dateStr2 + 'T00:00:00');
                const diffTime = date1.getTime() - date2.getTime();
                const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
                return diffDays;
            }

            function formatDate(dateString) {
                if (!dateString) return 'N/A';
                const [year, month, day] = dateString.split('-');
                return `${day}/${month}/${year}`;
            }
            
            /**
             * Retorna ícone de HTML para a CATEGORIA (usando Font Awesome)
             * @param {string} iconName - O nome do ícone (ex: 'caixa', 'presente')
             * @param {string} cssClass - Classes de cor/tamanho
             * @returns {string} - O HTML do ícone
             */
            function getCategoryIcon(iconName, cssClass) {
                let iconClass = '';
                switch (iconName) {
                    case 'presente':
                        iconClass = 'fa-gift';
                        break;
                    case 'eletronico':
                        iconClass = 'fa-mobile-screen';
                        break;
                    case 'roupa':
                        iconClass = 'fa-bag-shopping';
                        break;
                    case 'comida':
                        iconClass = 'fa-utensils';
                        break;
                    case 'livro':
                        iconClass = 'fa-book';
                        break;

                    case 'caixa':
                    default:
                        iconClass = 'fa-box';
                        break;
                }
                return `<i class="fa-solid ${iconClass} ${cssClass}"></i>`;
            }

            /**
             * Retorna classes e texto para o STATUS (badge)
             * @param {string} status
             * @returns {object}
             */
            function getStatusInfo(status) {
                switch (status) {
                    case 'Entregue':
                        return { statusClass: 'bg-green-100 text-green-800', statusText: 'Entregue' };
                    case 'Em Trânsito':
                        return { statusClass: 'bg-cyan-100 text-cyan-800 font-bold', statusText: 'Em Trânsito' };
                    case 'Atrasado':
                        // Cor alterada para Laranja para maior alerta
                        return { statusClass: 'bg-orange-100 text-orange-800 font-bold', statusText: 'Atrasado' };
                    case 'Cancelado':
                        return { statusClass: 'bg-red-100 text-red-800', statusText: 'Cancelado' };
                    case 'Aguardando Envio':
                    default:
                        return { statusClass: 'bg-purple-100 text-purple-800 font-bold', statusText: 'Aguard. Envio' };
                }
            }

            function escapeHTML(str) {
                if (typeof str !== 'string') return '';
                return str.replace(/[&<>"']/g, (match) => {
                    const map = {
                        '&': '&amp;',
                        '<': '&lt;',
                        '>': '&gt;',
                        '"': '&quot;',
                        "'": '&#39;'
                    };
                    return map[match];
                });
            }
            
            /**
             * Mostra uma mensagem de notificação (toast)
             * @param {string} message - A mensagem a ser exibida
             * @param {string} [bgColor='bg-teal-500'] - Cor de fundo do toast
             */
            let toastTimer;
            function showToast(message, bgColor = 'bg-teal-500') {
                if (toastTimer) {
                    clearTimeout(toastTimer);
                }

                toast.classList.remove('bg-teal-500', 'bg-red-500', 'bg-blue-500', 'bg-green-500', 'bg-orange-500');
                toast.classList.add(bgColor);
                
                toastMessage.textContent = message;

                toast.classList.remove('translate-x-[200%]');
                toast.classList.add('translate-x-0');

                toastTimer = setTimeout(() => {
                    toast.classList.remove('translate-x-0');
                    toast.classList.add('translate-x-[200%]');
                }, 3000);
            }

            // --- Inicializa a Aplicação ---
            init();
        });
    </script>

</body>
</html>
