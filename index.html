<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rastreador de Compras</title>
    <!-- 1. Carrega o TailwindCSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 2. Carrega a fonte Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- 3. Carrega o Font Awesome (para ícones estáveis) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" xintegrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A==" crossorigin="anonymous" referrerpolicy="no-referrer" />

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.6.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.6.0/firebase-database-compat.js"></script>
    
    <!-- Inicialização do Firebase -->
    <script>
        // Função para escapar strings HTML
        function escapeHTML(str) {
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        // Configuração do Firebase
        const firebaseConfig = {
            databaseURL: "https://rastreio-marc35-default-rtdb.firebaseio.com"
        };

        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);
        
        // Referência para o banco de dados
        const db = firebase.database();

        // Funções para interagir com o Firebase
        const firebaseService = {
            // Salvar um novo rastreio
            async saveRastreio(rastreioData) {
                try {
                    const newRastreioRef = db.ref('rastreios').push();
                    await newRastreioRef.set({
                        ...rastreioData,
                        createdAt: firebase.database.ServerValue.TIMESTAMP
                    });
                    return { success: true, id: newRastreioRef.key };
                } catch (error) {
                    console.error('Erro ao salvar rastreio:', error);
                    return { success: false, error };
                }
            },

            // Buscar todos os rastreios
            async getAllRastreios() {
                try {
                    const snapshot = await db.ref('rastreios').once('value');
                    return snapshot.val() || {};
                } catch (error) {
                    console.error('Erro ao buscar rastreios:', error);
                    return {};
                }
            },

            // Atualizar um rastreio
            async updateRastreio(rastreioId, updateData) {
                try {
                    await db.ref(`rastreios/${rastreioId}`).update({
                        ...updateData,
                        updatedAt: firebase.database.ServerValue.TIMESTAMP
                    });
                    return { success: true };
                } catch (error) {
                    console.error('Erro ao atualizar rastreio:', error);
                    return { success: false, error };
                }
            },

            // Deletar um rastreio
            async deleteRastreio(rastreioId) {
                try {
                    await db.ref(`rastreios/${rastreioId}`).remove();
                    return { success: true };
                } catch (error) {
                    console.error('Erro ao deletar rastreio:', error);
                    return { success: false, error };
                }
            },

            // Escutar mudanças em tempo real
            listenToRastreios(callback) {
                db.ref('rastreios').on('value', (snapshot) => {
                    const data = snapshot.val() || {};
                    callback(data);
                });
            },

            // Salvar um novo tipo de rastreio personalizado
            async saveCustomTrackingType(trackingType) {
                try {
                    const snapshot = await db.ref('customTrackingTypes').once('value');
                    const types = snapshot.val() || [];
                    if (!types.includes(trackingType)) {
                        types.push(trackingType);
                        await db.ref('customTrackingTypes').set(types);
                    }
                    return { success: true };
                } catch (error) {
                    console.error('Erro ao salvar tipo de rastreio:', error);
                    return { success: false, error };
                }
            },

            // Buscar todos os tipos de rastreio personalizados
            async getCustomTrackingTypes() {
                try {
                    const snapshot = await db.ref('customTrackingTypes').once('value');
                    return snapshot.val() || [];
                } catch (error) {
                    console.error('Erro ao buscar tipos de rastreio:', error);
                    return [];
                }
            }
        };
    </script>

    <!-- 4. Favicon temático (caixa) -->
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cpath d='M85,30 H15 C10,30 10,30 10,35 L10,85 C10,90 10,90 15,90 H85 C90,90 90,90 90,85 L90,35 C90,30 90,30 85,30 Z' fill='%2314b8a6'/%3E%3Cpath d='M10,35 L50,60 L90,35 M50,60 L50,90' stroke='%23f0fdfa' stroke-width='8' stroke-linecap='round' fill='none'/%3E%3Cpath d='M30,20 L70,20 L70,30 L30,30 Z' fill='%2314b8a6'/%3E%3Cpath d='M70,20 L90,35' stroke='%2314b8a6' stroke-width='2'/%3E%3Cpath d='M30,20 L10,35' stroke='%2314b8a6' stroke-width='2'/%3E%3C/svg%3E">

    <!-- 5. Estilos customizados e configuração do Tailwind -->
    <style>
        /* Define a fonte padrão para todo o corpo */
        body {
            font-family: 'Inter', sans-serif;
        }

        /* Estilos para o dropdown de lojas */
        .store-menu {
            scrollbar-width: thin;
            scrollbar-color: #94a3b8 #f1f5f9;
        }

        .store-menu::-webkit-scrollbar {
            width: 6px;
        }

        .store-menu::-webkit-scrollbar-track {
            background: #f1f5f9;
        }

        .store-menu::-webkit-scrollbar-thumb {
            background-color: #94a3b8;
            border-radius: 3px;
        }

        .store-option {
            padding: 0.5rem 0.75rem;
            transition: all 0.2s;
            cursor: pointer;
            font-size: 0.875rem;
            border-bottom: 1px solid #f1f5f9;
        }

        .store-option:last-child {

        }

        .store-option:hover {
            background-color: #f8fafc;
        }
        

        /* Animação de fade-in para o modal */
        .modal-fade-enter {
            opacity: 0;
            transform: scale(0.95);
        }
        .modal-fade-enter-active {
            opacity: 1;
            transform: scale(1);
            transition: all 0.2s ease-out;
        }
        .modal-fade-leave {
            opacity: 1;
            transform: scale(1);
        }
        .modal-fade-leave-active {
            opacity: 0;
            transform: scale(0.95);
            transition: all 0.2s ease-in;
        }

        /* Garante que os botões de filtro não quebrem a linha */
        /* Permite rolagem horizontal em telas pequenas */
        #filter-container {
            -ms-overflow-style: none;  /* IE and Edge */
            scrollbar-width: none;  /* Firefox */
        }
        #filter-container::-webkit-scrollbar {
            display: none; /* Chrome, Safari, Opera */
        }

        /* Estilos para a área dos botões de backup */
        .group:hover .group-hover\:opacity-100 {
            opacity: 1;
        }
        
        .group:hover .group-hover\:visible {
            visibility: visible;
        }
        
        .group:hover .group-hover\:translate-x-0 {
            transform: translateX(0);
        }

        /* --- ESTILOS PARA O MODAL (UX 10/10) --- */

        /* Estilo para o seletor de ícone visual (radio) */
        /* Container do carrossel */
        #icon-carousel {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            position: relative;
            padding: 0 3rem;
        }

        #icon-carousel-content {
            display: flex;
            gap: 0.5rem;
            overflow-x: hidden;
            scroll-behavior: smooth;
            -ms-overflow-style: none;
            scrollbar-width: none;
            position: relative;
            padding: 0.5rem 0;
        }

        #icon-carousel-content::-webkit-scrollbar {
            display: none;
        }

        /* Botões de navegação */
        .carousel-nav-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 2.5rem;
            height: 2.5rem;
            border-radius: 9999px;
            background-color: white;
            border: 2px solid #e5e7eb;
            color: #4b5563;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
            z-index: 10;
        }

        .carousel-nav-btn:hover {
            background-color: #f3f4f6;
            color: #111827;
            border-color: #d1d5db;
        }

        .carousel-nav-btn.prev {
            left: 0;
        }

        .carousel-nav-btn.next {
            right: 0;
        }

        .icon-radio-label {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 3.5rem;
            height: 3.5rem;
            border: 2px solid transparent;
            border-radius: 0.75rem;
            background-color: #f3f4f6;
            color: #4b5563;
            cursor: pointer;
            transition: all 0.2s ease-in-out;
            position: relative;
            flex: 0 0 auto;
        }

        .icon-radio-label:hover {
            background-color: #e5e7eb;
        }
        
        /* Ajuste de tamanho do ícone Font Awesome */
        .icon-radio-label .fa-solid {
            font-size: 1.5rem;
        }

        /* Estilo para o radio checked */
        .icon-radio:checked + .icon-radio-label {
            border-color: #0d9488; /* border-teal-600 */
            background-color: #f0fdfa; /* bg-teal-50 */
            color: #0d9488; /* text-teal-600 */
            box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.1), 0 1px 2px -1px rgba(0, 0, 0, 0.1);
        }

        /* (IMPORTANTE) Esconde o radio button real */
        .icon-radio {
            display: none;
        }

        /* Estilo padrão para inputs do formulário */
        .form-input-base {
            width: 100%;
            background-color: #f3f4f6; /* bg-gray-100 */
            border: 2px solid #f3f4f6; /* bg-gray-100 */
            border-radius: 0.5rem; /* rounded-lg */
            padding: 0.75rem 1rem; /* py-3 px-4 */
            color: #111827; /* text-gray-900 */
            transition: all 0.2s ease-in-out;
        }
        .form-input-base:focus {
            background-color: #ffffff;
            border-color: #14b8a6; /* ring-teal-500 */
            box-shadow: 0 0 0 2px #a7f3d0; /* focus:ring-teal-200 */
            outline: none;
        }

    </style>
</head>
<body class="bg-blue-50 text-gray-900">

                <!-- Título -->

                            <!-- Opção 16: Esportes -->

                            <!-- Opção 17: Beleza -->
                            <input type="radio" id="icon-beleza" name="item-icon-radio" value="beleza" class="icon-radio">
                            <label for="icon-beleza" class="icon-radio-label" title="Beleza/Cosméticos">

                            </label>
                            <!-- Opção 18: Relógio -->
                            <input type="radio" id="icon-relogio" name="item-icon-radio" value="relogio" class="icon-radio">
                            <label for="icon-relogio" class="icon-radio-label" title="Relógios/Acessórios">
                                <i class="fa-solid fa-clock"></i>
                            </label>
                            <!-- Opção 19: Arte -->
                            <input type="radio" id="icon-arte" name="item-icon-radio" value="arte" class="icon-radio">
                            <label for="icon-arte" class="icon-radio-label" title="Arte/Material Artístico">
                                <i class="fa-solid fa-palette"></i>
                            </label>
                            <!-- Opção 20: Pet -->
                            <input type="radio" id="icon-pet" name="item-icon-radio" value="pet" class="icon-radio">
                            <label for="icon-pet" class="icon-radio-label" title="Pet/Animais">
                                <i class="fa-solid fa-paw"></i>

                        <button type="button" class="carousel-nav-btn next" id="carousel-next">
                            <i class="fa-solid fa-chevron-right"></i>
                        </button>
                    </div>
                </div>

                <!-- Nome do Item (Limpo) -->
                <div>
                    <input type="text" id="item-name" class="form-input-base" placeholder="Nome do item" required>
                </div>

                <!-- Loja (Com dropdown estilizado) -->
                <div>
                    <label for="store-name" class="block text-sm font-medium text-gray-700 mb-1">
                        Loja
                    </label>
                    <div class="relative store-dropdown-container">
                        <div class="relative flex items-center">
                            <input type="text" 
                                   id="store-name" 
                                   class="form-input-base pl-9 pr-8" 
                                   placeholder="Nome da loja"
                                   autocomplete="off">
                            <i class="fa-solid fa-store absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"></i>
                            <button type="button" 
                                    class="store-toggle absolute right-2 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600 focus:outline-none">
                                <i class="fa-solid fa-chevron-down text-[0.6rem] opacity-70"></i>
                            </button>
                        </div>
                        <div class="store-menu hidden absolute left-0 right-0 mt-1 bg-white rounded-lg shadow-lg border-x border-gray-100 max-h-48 overflow-y-auto z-10 overflow-hidden">

                                <!-- Preenchido dinamicamente com lojas existentes -->
                            </div>

                    <!-- Data da Compra (Limpo) -->
                    <div>

                    <!-- Previsão de Entrega (Limpo) -->
                    <div>
                        <label for="delivery-date" class="block text-sm font-medium text-gray-700 mb-1">Entrega</label>
                        <input type="date" id="delivery-date" class="form-input-base" required>
                    </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <!-- Status (Limpo) -->
                    <div>
                        <label for="item-status" class="block text-sm font-medium text-gray-700 mb-1">Status</label>
                        <select id="item-status" class="form-input-base" required>
                            <option value="Aguardando Envio">Aguardando Envio</option>
                            <option value="Em Trânsito">Em Trânsito</option>
                            <option value="Atrasado">Atrasado</option>
                            <option value="Entregue">Entregue</option>
                            <option value="Cancelado">Cancelado</option>
                        </select>

                    <!-- Rastreio (Limpo) -->

                        <label for="tracking-code" class="block text-sm font-medium text-gray-700 mb-1">Rastreio</label>
                        <input type="text" id="tracking-code" class="form-input-base" placeholder="Código de Rastreio">
                    </div>
                </div>

                <!-- Tipo de Rastreio e Link do Pedido -->
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label for="tracking-type" class="block text-sm font-medium text-gray-700 mb-1">Tipo de Rastreio</label>
                        <div class="flex gap-2">
                            <select id="tracking-type" class="form-input-base flex-1">
                                <option value="correios">Correios</option>
                                <option value="jtexpress">JT Express</option>
                                <option value="outro">Outro</option>
                            </select>
                            <input type="text" 
                                   id="custom-tracking-type"
                                   class="form-input-base w-full"
                                   placeholder="Digite o tipo personalizado"
                                   style="display: none;"
                                   list="tracking-type-suggestions">
                            <datalist id="tracking-type-suggestions">
                                <!-- Será preenchido dinamicamente -->
                            </datalist>
                        </div>
                    </div>
                    <div>
                        <label for="order-link" class="block text-sm font-medium text-gray-700 mb-1">
                            Link do Produto
                        </label>
                        <div class="relative">
                            <input type="url" 
                                   id="order-link" 
                                   class="form-input-base pl-9" 
                                   placeholder="Cole aqui o link do produto para tornar o título clicável">
                            <i class="fa-solid fa-link absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"></i>
                        </div>
                    </div>
                </div>

                <!-- Botões do Formulário -->
                <div class="flex justify-end gap-4 pt-4">
                    <button type="button" id="cancel-btn" class="px-5 py-2.5 rounded-lg text-gray-700 bg-gray-100 hover:bg-gray-200 font-medium transition-colors">
                        Cancelar
                    </button>
                    <!-- Botão Salvar com a nova cor -->
                    <button type="submit" id="save-btn" class="px-5 py-2.5 rounded-lg text-white bg-gradient-to-r from-teal-500 to-cyan-600 hover:from-teal-600 hover:to-cyan-700 font-medium transition-colors shadow hover:shadow-lg">
                        Salvar Compra
                    </button>
                </div>
            </form>
        </div>
    </div>
    
    <!-- Mensagem de Confirmação (Toast) -->
    <div id="toast" class="fixed bottom-10 right-10 flex items-center gap-3 bg-teal-500 text-white px-5 py-3 rounded-lg shadow-xl transition-all duration-300 translate-x-[200%]">
        <i class="fa-solid fa-circle-check w-5 h-5"></i>
        <span id="toast-message" class="font-medium">Ação completada!</span>
    </div>


    <!-- 4. JavaScript da Aplicação -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {

            // --- Seletores do DOM ---
            const purchaseList = document.getElementById('purchase-list');
            const emptyState = document.getElementById('empty-state');
            const modal = document.getElementById('purchase-modal');
            const form = document.getElementById('purchase-form');
            const modalTitle = document.getElementById('modal-title');
            const editIdInput = document.getElementById('edit-id');
            const openModalBtn = document.getElementById('open-modal-btn');
            const closeModalBtn = document.getElementById('close-modal-btn');
            const cancelBtn = document.getElementById('cancel-btn');
            const filterContainer = document.getElementById('filter-container');
            const toast = document.getElementById('toast');
            const toastMessage = document.getElementById('toast-message');

            // --- Variáveis de Estado ---
            let state = {
                purchases: [], // Array principal de dados
                filter: 'todos', // Filtro atual
                storeFilter: '', // Filtro de loja
                categoryFilter: '', // Filtro de categoria
                showArchived: false, // Controle de arquivados
                lastUsedValues: { // Armazena últimos valores usados
                    store: '',
                    trackingType: 'correios',
                    icon: 'caixa'
                }
            };
            const STORAGE_KEY = 'my_local_purchases';

            // --- Funções Principais ---

            /**
             * Atualiza a lista de sugestões de lojas
             */
            function updateSuggestions() {
                const stores = new Set();
                const trackingTypes = new Set(['correios', 'jtexpress']);
                
                // Coleta todas as lojas únicas do Firebase
                state.purchases.forEach(purchase => {
                    if (purchase.store && purchase.store.trim()) {
                        stores.add(purchase.store.trim());
                    }
                    if (purchase.trackingType && 
                        !['correios', 'jtexpress', 'outro'].includes(purchase.trackingType.toLowerCase())) {
                        trackingTypes.add(purchase.trackingType);
                    }
                });

                // Atualiza select de filtro de lojas
                const storeFilter = document.getElementById('store-filter');
                const currentValue = storeFilter.value;
                storeFilter.innerHTML = '<option value="">Todas as lojas</option>' +
                    Array.from(stores)
                        .sort((a, b) => a.localeCompare(b, 'pt-BR'))
                        .map(store => `<option value="${escapeHTML(store)}">${escapeHTML(store)}</option>`)
                        .join('');
                storeFilter.value = currentValue;

                // Atualiza datalist de tipos de rastreio
                const trackingSuggestions = document.getElementById('tracking-type-suggestions');
                trackingSuggestions.innerHTML = Array.from(trackingTypes)
                    .sort()
                    .map(type => `<option value="${escapeHTML(type)}">`)
                    .join('');
            }

            /**
             * Atualiza os contadores de itens
             */
            function updateCounters(filteredItems) {
                const totalActive = state.purchases.filter(p => !p.archived).length;
                const totalArchived = state.purchases.filter(p => p.archived).length;
                
                if (state.showArchived) {
                    document.getElementById('total-count').textContent = totalArchived;
                    document.getElementById('filtered-count').textContent = filteredItems.length;
                } else {
                    document.getElementById('total-count').textContent = totalActive;
                    document.getElementById('filtered-count').textContent = filteredItems.length;
                }
            }

            /**
             * Inicializa a aplicação
             */
            async function init() {
                await loadPurchasesFromStorage();
                addEventListeners();
                setupCarousel(); // Inicializa o carrossel
                
                // Escuta mudanças em tempo real
                db.ref('purchases').on('value', (snapshot) => {
                    const data = snapshot.val();
                    state.purchases = data ? Object.values(data) : [];
                    sortPurchases();
                    updateSuggestions();
                    renderList();
                });
            }

            /**
             * Carrega os dados do Firebase para o estado
             */
            async function loadPurchasesFromStorage() {
                try {
                    // Carrega as compras
                    const purchasesSnapshot = await db.ref('purchases').once('value');
                    const purchasesData = purchasesSnapshot.val();
                    state.purchases = purchasesData ? Object.values(purchasesData) : [];

                    // Carrega o state
                    const stateSnapshot = await db.ref('state/lastUsedValues').once('value');
                    const lastUsedValues = stateSnapshot.val();
                    if (lastUsedValues) {
                        state.lastUsedValues = {
                            ...state.lastUsedValues,
                            ...lastUsedValues
                        };
                    }

                    sortPurchases(); // Ordena ao carregar
                    updateSuggestions(); // Atualiza as sugestões de lojas e tipos de rastreio
                    renderList(); // Atualiza a interface
                } catch (error) {
                    console.error('Erro ao carregar compras:', error);
                    showToast('Erro ao carregar compras', 'bg-red-500');
                }
            }

            /**
             * Salva o estado atual no Firebase
             */
            async function savePurchasesToStorage() {
                try {
                    // Salva as compras
                    const purchasesObject = {};
                    state.purchases.forEach(purchase => {
                        purchasesObject[purchase.id] = purchase;
                    });
                    await db.ref('purchases').set(purchasesObject);
                    
                    // Salva o state
                    await db.ref('state/lastUsedValues').set(state.lastUsedValues);
                } catch (error) {
                    console.error('Erro ao salvar compras:', error);
                    showToast('Erro ao salvar compras', 'bg-red-500');
                }
            }

            /**
             * Renderiza a lista de compras na tela
             */
            function renderList() {
                purchaseList.innerHTML = '';

                // Verifica e atualiza status de atraso antes de renderizar
                const statusChanged = checkAndUpdateStatus();
                if (statusChanged) {
                    sortPurchases(); // Re-ordena se o status mudou (ex: Atrasado)
                    savePurchasesToStorage(); // Salva se algum status mudou
                }

                // Atualiza as sugestões antes de filtrar
                updateSuggestions();

                let filteredPurchases = state.purchases.filter(item => {
                    // Filtro de status
                    if (state.filter !== 'todos' && item.status !== state.filter) return false;
                    
                    // Filtro de loja
                    if (state.storeFilter && (!item.store || item.store.trim().toLowerCase() !== state.storeFilter.trim().toLowerCase())) return false;
                    
                    // Filtro de categoria
                    if (state.categoryFilter && (!item.icon || item.icon !== state.categoryFilter)) return false;
                    
                    // Filtro de arquivados
                    if (state.showArchived) {
                        return item.archived;
                    } else {
                        return !item.archived;
                    }
                });
                
                // Atualiza contadores
                updateCounters(filteredPurchases);

                if (state.purchases.length === 0) {
                    emptyState.classList.remove('hidden');
                    purchaseList.classList.add('hidden');
                } else {
                    emptyState.classList.add('hidden');
                    purchaseList.classList.remove('hidden');
                }

                filteredPurchases.forEach(item => {
                    const card = createPurchaseCard(item);
                    purchaseList.innerHTML += card;
                });
            }

            /**
             * Verifica se alguma compra está atrasada e atualiza o status
             * Também reverte o status se a data for corrigida
             * @returns {boolean} - Retorna true se algum status foi alterado
             */
            function checkAndUpdateStatus() {
                const today = getTodayDate(); // CORREÇÃO: Usa a data local
                let statusChanged = false;

                state.purchases.forEach(item => {
                    const isOverdue = item.deliveryDate < today;
                    const isFinalStatus = item.status === 'Entregue' || item.status === 'Cancelado';

                    // LÓGICA 1: Se deve ser marcado como Atrasado
                    if (isOverdue && !isFinalStatus) {
                        if (item.status !== 'Atrasado') {
                            item.status = 'Atrasado';
                            statusChanged = true;
                        }
                    // LÓGICA 2: Se estava Atrasado, mas a data foi corrigida para hoje ou futuro
                    } else if (item.status === 'Atrasado' && !isOverdue) {
                        // Reverte para um status seguro
                        item.status = 'Aguardando Envio'; 
                        statusChanged = true;
                    }
                });
                return statusChanged;
            }

            /**
             * Cria o HTML para um card de compra (DESIGN REVITALIZADO)
             * @param {object} item - O objeto da compra
             * @returns {string} - O HTML do card
             */
            function createPurchaseCard(item) {
                // Info de Status (para o badge)
                const { statusClass, statusText, statusColorClass } = getStatusInfo(item.status);
                // Ícone de Categoria (para o ícone principal)
                const categoryIcon = getCategoryIcon(item.icon, 'text-teal-600 w-7 h-7'); // Classe base

                // --- Lógica dos Contadores de Data ---
                const today = getTodayDate();
                
                // 1. Contador de Tempo de Compra
                const daysSincePurchase = calculateDaysDifference(today, item.purchaseDate);
                let purchaseDaysText = ''; // Texto principal
                let purchaseSubText = `(em ${formatDate(item.purchaseDate)})`; // Texto secundário (data)

                if (daysSincePurchase < 0) {
                    purchaseDaysText = `Compra Futura`;
                } else if (daysSincePurchase === 0) {
                    purchaseDaysText = `Comprado Hoje!`; 
                } else if (daysSincePurchase === 1) {
                    purchaseDaysText = `1 Dia`; // Singular
                } else {
                    purchaseDaysText = `${daysSincePurchase} Dias`; // Plural
                }
                
                // 2. Contador de Entrega (Countdown)
                const daysToDelivery = calculateDaysDifference(item.deliveryDate, today);
                let deliveryTimeHTML = '';
                let deliveryColorClass = 'text-gray-800'; // Cor padrão do countdown
                
                if (item.status === 'Entregue' || item.status === 'Cancelado') {
                    deliveryTimeHTML = item.status; // Mostra o status final
                    deliveryColorClass = 'text-gray-500';
                } else if (daysToDelivery > 0) {
                    deliveryTimeHTML = `Faltam ${daysToDelivery} ${daysToDelivery === 1 ? 'dia' : 'dias'}`;
                    deliveryColorClass = 'text-gray-800';
                } else if (daysToDelivery === 0) {
                    deliveryTimeHTML = `Entrega Hoje!`;
                    deliveryColorClass = 'text-cyan-600';
                } else {
                    // Atrasado
                    const daysLate = Math.abs(daysToDelivery);
                    deliveryTimeHTML = `+${daysLate} ${daysLate === 1 ? 'dia' : 'dias'}`;
                    deliveryColorClass = 'text-red-600'; // Atrasado (vermelho)
                }
                
                // Datas formatadas
                const deliveryDate = formatDate(item.deliveryDate);
                // const purchaseDate = formatDate(item.purchaseDate); // (agora usado no purchaseSubText)

                // Botão de rastreio
                const getTrackingUrl = (type, code) => {
                    switch (type) {
                        case 'jtexpress':
                            return `https://www.jtexpress.com.br/trajectoryQuery?waybillNo=${code}&type=0`;
                        case 'correios':
                            return `https://rastreamento.correios.com.br/app/index.php?objetos=${code}`;
                        default:
                            return '#';
                    }
                };

                const trackingButtonHTML = item.trackingCode 
                    ? `<div class="mt-3">
                        <a href="${getTrackingUrl(item.trackingType || 'correios', encodeURIComponent(item.trackingCode))}" 
                            target="_blank" 
                            rel="noopener noreferrer"
                            class="flex items-center justify-center gap-2 w-full text-sm font-medium text-teal-700 bg-teal-50 hover:bg-teal-100 px-3 py-2.5 rounded-lg transition-colors">
                            <i class="fa-solid fa-truck-fast w-4 h-4"></i>
                            Rastrear ${item.trackingType === 'jtexpress' ? 'JT Express' : item.trackingType === 'outro' ? 'Pedido' : 'Correios'}
                       </a>
                       </div>`
                    : `<div class="mt-3">
                        <div class="flex items-center justify-center gap-2 w-full text-sm font-medium text-red-700 bg-red-50 px-3 py-2.5 rounded-lg">
                            <i class="fa-solid fa-circle-exclamation w-4 h-4"></i>
                            Sem Rastreio
                        </div>
                       </div>`;
                    
                // Ícone da Loja
                const storeHTML = item.store 
                    ? `<p class="text-sm text-gray-500 flex items-center gap-1.5 mt-1">
                           <i class="fa-solid fa-store w-3.5 h-3.5 text-gray-400"></i>
                           <span class="truncate">${escapeHTML(item.store)}</span>
                       </p>`
                    : '';
                
                // (*** NOVO ***) Botão "Marcar como Entregue"
                const deliverButtonHTML = (item.status !== 'Entregue' && item.status !== 'Cancelado')
                    ? `<button data-id="${item.id}" class="deliver-btn flex items-center gap-1.5 text-sm font-medium text-green-700 bg-green-50 hover:bg-green-200 px-3 py-1.5 rounded-md transition-colors">
                           <i class="fa-solid fa-check-double w-4 h-4"></i>
                           Entregue
                       </button>`
                    : '<div></div>'; // Placeholder vazio para manter o layout

                return `
                                <div class="bg-white rounded-2xl shadow-xl border border-gray-100 transform transition-all duration-300 hover:scale-[1.02] hover:shadow-2xl hover:shadow-teal-100/50 ${item.archived ? 'opacity-75' : ''}">
                        <!-- Cabeçalho do Card -->
                        <div class="p-3 pb-0">
                            <div class="flex justify-between items-start">
                                <div class="flex items-center gap-3">
                                    <div class="flex-shrink-0 w-16 h-16 bg-gray-50/50 rounded-lg flex items-center justify-center text-2xl">${categoryIcon}</div>
                                    <div class="flex-1 min-w-0 flex flex-col justify-center h-16">
                                        <h3 class="text-base font-bold text-gray-800 leading-tight fit-text hover:text-teal-600 transition-colors cursor-pointer" 
                                            data-max-size="16"
                                            data-min-size="12"
                                            title="${escapeHTML(item.name)}"
                                            onclick="window.open('${item.orderLink || '#'}', '_blank')">${escapeHTML(item.name)}</h3>
                                        ${storeHTML}
                                    </div>
                                </div>
                                <!-- Badge de Status com Dropdown -->
                                <div class="flex flex-col items-end gap-2">
                                    <div class="relative status-dropdown-container">
                                        <button class="status-toggle text-xs font-bold px-2.5 py-1 rounded-full ${statusClass} whitespace-nowrap hover:shadow-sm transition-all flex items-center gap-1.5" data-id="${item.id}">
                                            ${escapeHTML(statusText)}
                                            <i class="fa-solid fa-chevron-down text-[0.6rem] opacity-70"></i>
                                        </button>
                                        <div class="status-menu hidden absolute right-0 mt-1 bg-white rounded-lg shadow-lg border-x border-gray-100 min-w-[140px] z-10 overflow-hidden">
                                            ${generateStatusOptions(item.status, item.id)}
                                        </div>
                                    </div>
                                    ${item.status === 'Entregue' && !item.archived 
                                        ? `<button data-id="${item.id}" class="archive-btn text-xs px-2 py-1 text-gray-600 hover:text-gray-900 font-medium">
                                            <i class="fa-solid fa-box-archive"></i>
                                            Arquivar
                                        </button>`
                                        : item.archived 
                                            ? '<span class="text-xs font-medium text-gray-500">Arquivado</span>' 
                                            : ''}
                                </div>
                            </div>
                        </div>

                        <!-- Corpo do Card (Contadores) -->
                        <div class="p-3 pt-2">
                            <div class="grid grid-cols-2 gap-3">
                                <!-- Lado Esquerdo: Countdown de Entrega -->
                                <div class="border-r border-gray-100 pr-3">
                                    <label class="text-xs text-gray-500 uppercase font-medium">Entrega</label>
                                    <p class="text-lg font-extrabold ${deliveryColorClass}">${deliveryTimeHTML}</p>
                                    <p class="text-xs text-gray-600">${deliveryDate}</p>
                                    <p class="text-xs text-gray-400 italic">${getDayOfWeek(item.deliveryDate)}</p>
                                </div>
                                <!-- Lado Direito: Dias de Compra -->
                                <div>
                                    <label class="text-xs text-gray-500 uppercase font-medium">Compra</label>
                                    <p class="text-lg font-extrabold text-gray-800">${purchaseDaysText}</p>
                                    <p class="text-xs text-gray-600">${purchaseSubText}</p>
                                </div>
                            </div>
                            
                            <!-- Botão de Rastreio (se existir) -->
                            ${trackingButtonHTML ? `
                            <div class="mt-3">
                                ${trackingButtonHTML}
                            </div>
                            ` : ''}
                        </div>
                        
                        <!-- Botões de Ação (Rodapé) -->
                        <div class="px-3 py-2 border-t border-gray-100 flex justify-between items-center gap-2">
                            <!-- Botão "Entregue" à esquerda -->
                            ${deliverButtonHTML}
                            
                            <!-- Botões "Editar" e "Excluir" à direita -->
                            <div class="flex gap-1.5">
                                <button data-id="${item.id}" class="edit-btn flex items-center gap-1 text-xs font-medium text-gray-700 bg-gray-50 hover:bg-gray-200 px-2 py-1 rounded-md transition-colors">
                                    <i class="fa-solid fa-pencil w-3.5 h-3.5"></i>
                                    Editar
                                </button>
                                <button data-id="${item.id}" class="delete-btn flex items-center gap-1 text-xs font-medium text-red-600 bg-red-50 hover:bg-red-100 px-2 py-1 rounded-md transition-colors">
                                    <i class="fa-solid fa-trash-can w-3.5 h-3.5"></i>
                                    Excluir
                                </button>
                            </div>

            /**
             * Adiciona todos os event listeners da aplicação
             */
            function addEventListeners() {
                // Event listeners existentes
                openModalBtn.addEventListener('click', () => openModal());
                closeModalBtn.addEventListener('click', closeModal);
                cancelBtn.addEventListener('click', closeModal);
                modal.addEventListener('click', (e) => {
                    if (e.target === modal) {
                        closeModal();
                    }
                });
                form.addEventListener('submit', handleFormSubmit);
                purchaseList.addEventListener('click', handleListActions);
                filterContainer.addEventListener('click', handleFilterClick);

                // Event listeners para o campo de loja com dropdown estilizado
                const storeNameInput = document.getElementById('store-name');
                const trackingTypeSelect = document.getElementById('tracking-type');
                const storeToggle = document.querySelector('.store-toggle');
                const storeMenu = document.querySelector('.store-menu');
                const storeOptions = document.querySelector('.store-options');

                // Função para atualizar as opções do dropdown de lojas
                function updateStoreOptions() {
                    const stores = new Set();
                    state.purchases.forEach(purchase => {
                        if (purchase.store && purchase.store.trim()) {
                            stores.add(purchase.store.trim());
                        }
                    });

                    storeOptions.innerHTML = Array.from(stores)
                        .sort((a, b) => a.localeCompare(b, 'pt-BR'))
                        .map(store => `
                            <div class="store-option px-3 py-2 cursor-pointer hover:bg-gray-50 text-sm text-gray-700">
                                ${escapeHTML(store)}
                            </div>
                        `).join('');
                }

                // Toggle do dropdown
                storeToggle.addEventListener('click', (e) => {
                    e.preventDefault();
                    storeMenu.classList.toggle('hidden');
                    updateStoreOptions(); // Atualiza as opções ao abrir
                });

                // Fecha o dropdown ao clicar fora
                document.addEventListener('click', (e) => {
                    if (!e.target.closest('.store-dropdown-container')) {
                        storeMenu.classList.add('hidden');
                    }
                });

                // Seleciona a loja ao clicar na opção
                storeOptions.addEventListener('click', (e) => {
                    const option = e.target.closest('.store-option');
                    if (option) {
                        const storeName = option.textContent.trim();
                        storeNameInput.value = storeName;
                        storeMenu.classList.add('hidden');
                        
                        // Lógica do Mercado Livre
                        if (storeName.toLowerCase() === 'mercado livre') {
                            let mlOption = Array.from(trackingTypeSelect.options)
                                .find(opt => opt.value === 'Mercado Livre');
                            
                            if (!mlOption) {
                                const outroOption = Array.from(trackingTypeSelect.options)
                                    .find(opt => opt.value === 'outro');
                                mlOption = new Option('Mercado Livre', 'Mercado Livre');
                                trackingTypeSelect.insertBefore(mlOption, outroOption);
                            }
                            
                            trackingTypeSelect.value = 'Mercado Livre';
                            document.getElementById('custom-tracking-type').style.display = 'none';
                        }
                    }
                });

                // Atualiza opções quando o usuário digita
                storeNameInput.addEventListener('input', (e) => {
                    const value = e.target.value.toLowerCase().trim();
                    const options = document.querySelectorAll('.store-option');
                    
                    options.forEach(option => {
                        const text = option.textContent.toLowerCase();
                        if (text.includes(value)) {
                            option.style.display = 'block';
                        } else {
                            option.style.display = 'none';
                        }
                    });
                    
                    if (!storeMenu.classList.contains('hidden') && !value) {
                        updateStoreOptions();
                    }
                });

                // Event listeners para backup/restore
                document.getElementById('backup-btn').addEventListener('click', createBackup);
                document.getElementById('restore-btn').addEventListener('click', openRestoreModal);
                document.getElementById('close-restore-modal-btn').addEventListener('click', closeRestoreModal);
                
                // Fecha o modal de restauração ao clicar fora
                document.getElementById('restore-modal').addEventListener('click', (e) => {
                    if (e.target.id === 'restore-modal') {
                        closeRestoreModal();
                    }
                });

                // Filtros de loja e categoria
                const storeFilter = document.getElementById('store-filter');
                const categoryFilter = document.getElementById('category-filter');
                
                storeFilter.addEventListener('change', (e) => {
                    state.storeFilter = e.target.value;
                    updateSuggestions(); // Atualiza as sugestões quando mudar o filtro
                    renderList();
                });
                
                categoryFilter.addEventListener('change', (e) => {
                    state.categoryFilter = e.target.value;
                    renderList();
                });

                // Inicializa as sugestões e o dropdown de lojas
                updateSuggestions();
                updateStoreOptions(); // Atualiza as opções do dropdown estilizado

                // Gerencia o tipo de rastreio personalizado
                const trackingType = document.getElementById('tracking-type');
                const customTrackingType = document.getElementById('custom-tracking-type');
                
                trackingType.addEventListener('change', (e) => {
                    const isCustom = e.target.value === 'outro';
                    customTrackingType.style.display = isCustom ? 'block' : 'none';
                    if (!isCustom) customTrackingType.value = '';
                });

                // Ao abrir o modal, reseta o campo personalizado
                document.getElementById('open-modal-btn').addEventListener('click', () => {
                    const isCustom = trackingType.value === 'outro';
                    customTrackingType.style.display = isCustom ? 'block' : 'none';
                });

                // Toggle arquivados
                const toggleArchivedBtn = document.getElementById('toggle-archived');
                toggleArchivedBtn.addEventListener('click', () => {
                    state.showArchived = !state.showArchived;
                    toggleArchivedBtn.innerHTML = state.showArchived 
                        ? '<i class="fa-solid fa-box-open"></i> Mostrar Ativos'
                        : '<i class="fa-solid fa-box-archive"></i> Mostrar Arquivados';
                    renderList();
                });

                // Handler para botões de restaurar e excluir backup
                // Event listener para o dropdown de status nos cards
                document.addEventListener('click', (e) => {
                    const statusToggle = e.target.closest('.status-toggle');
                    const statusOption = e.target.closest('.status-option');
                    
                    // Fecha todos os menus se clicar fora
                    if (!statusToggle && !statusOption) {
                        document.querySelectorAll('.status-menu').forEach(menu => {
                            menu.classList.add('hidden');
                        });
                        return;
                    }

                    // Toggle do menu de status
                    if (statusToggle) {
                        const container = statusToggle.closest('.status-dropdown-container');
                        const menu = container.querySelector('.status-menu');
                        
                        // Fecha outros menus abertos
                        document.querySelectorAll('.status-menu').forEach(otherMenu => {
                            if (otherMenu !== menu) {
                                otherMenu.classList.add('hidden');
                            }
                        });

                        menu.classList.toggle('hidden');
                        e.stopPropagation();
                    }

                    // Clique em uma opção do menu
                    if (statusOption) {
                        const newStatus = statusOption.dataset.status;
                        const itemId = statusOption.dataset.id;
                        
                        // Atualiza o status
                        updateItemStatus(itemId, newStatus);
                        
                        // Fecha o menu
                        statusOption.closest('.status-menu').classList.add('hidden');
                    }
                });

                // Função para atualizar o status de um item
                async function updateItemStatus(itemId, newStatus) {
                    const index = state.purchases.findIndex(item => item.id === itemId);
                    if (index === -1) return;

                    try {
                        // Se o novo status for 'Entregue', marca como arquivado também
                        const shouldArchive = newStatus === 'Entregue';
                        
                        // Atualiza o item
                        state.purchases[index] = {
                            ...state.purchases[index],
                            status: newStatus,
                            archived: shouldArchive || state.purchases[index].archived,
                            updatedAt: firebase.database.ServerValue.TIMESTAMP
                        };

                        await savePurchasesToStorage();
                        sortPurchases();
                        renderList();
                        
                        const statusInfo = getStatusInfo(newStatus);
                        showToast(`Status atualizado para ${statusInfo.statusText}!`, 
                                newStatus === 'Entregue' ? 'bg-green-500' : 
                                newStatus === 'Cancelado' ? 'bg-red-500' : 'bg-teal-500');
                    } catch (error) {
                        console.error('Erro ao atualizar status:', error);
                        showToast('Erro ao atualizar status', 'bg-red-500');
                    }
                }

                document.getElementById('backups-list').addEventListener('click', async (e) => {
                    const button = e.target.closest('button[data-action]');
                    if (!button) return;

                    const action = button.dataset.action;
                    const backupId = button.dataset.id;

                    if (action === 'restore') {
                        try {
                            if (!confirm('Tem certeza que deseja restaurar este backup? Os dados atuais serão substituídos.')) {
                                return;
                            }
                            const snapshot = await db.ref(`backups/${backupId}`).once('value');
                            const backup = snapshot.val();
                            if (!backup || !backup.data) throw new Error('Backup inválido');
                            await db.ref('purchases').set(backup.data);
                            closeRestoreModal();
                            showToast('Backup restaurado com sucesso!', 'bg-green-500');
                        } catch (error) {
                            console.error('Erro ao restaurar backup:', error);
                            showToast('Erro ao restaurar backup', 'bg-red-500');
                        }
                    } else if (action === 'delete') {
                        try {
                            if (!confirm('Tem certeza que deseja excluir este backup?')) {
                                return;
                            }
                            await db.ref(`backups/${backupId}`).remove();
                            showToast('Backup excluído com sucesso!', 'bg-red-500');
                            openRestoreModal(); // Recarrega a lista
                        } catch (error) {
                            console.error('Erro ao excluir backup:', error);
                            showToast('Erro ao excluir backup', 'bg-red-500');
                        }
                    }
                });
            }

            /**
             * Manipula o envio do formulário (Cria ou Atualiza)
             */
            async function handleFormSubmit(e) {
                e.preventDefault();

                // Lógica para ler o novo seletor de ícone (radio)
                const selectedIcon = document.querySelector('input[name="item-icon-radio"]:checked');
                
                const formData = {
                    name: document.getElementById('item-name').value.trim(),
                    store: document.getElementById('store-name').value.trim(),
                    purchaseDate: document.getElementById('purchase-date').value,
                    deliveryDate: document.getElementById('delivery-date').value,
                    status: document.getElementById('item-status').value,
                    trackingCode: document.getElementById('tracking-code').value.trim(),
                    icon: selectedIcon ? selectedIcon.value : 'caixa', // Pega o valor do radio
                };
                
                const editId = editIdInput.value;

                let trackingType = document.getElementById('tracking-type').value;
                if (trackingType === 'outro') {
                    const customType = document.getElementById('custom-tracking-type').value.trim();
                    if (customType) {
                        trackingType = customType;
                        // Salva o novo tipo de rastreio personalizado
                        await firebaseService.saveCustomTrackingType(customType);
                        await updateTrackingTypeSuggestions(); // Atualiza a lista de sugestões
                    }
                }

                // Atualiza os últimos valores usados
                state.lastUsedValues = {
                    ...state.lastUsedValues,
                    store: formData.store,
                    trackingType,
                    icon: formData.icon
                };

                const formDataExtended = {
                    ...formData,
                    trackingType,
                    orderLink: document.getElementById('order-link').value.trim(),
                    archived: false
                };

                if (editId) {
                    // LÓGICA DE ATUALIZAÇÃO DE STATUS
                    const today = getTodayDate();
                    const isOverdue = formDataExtended.deliveryDate < today;
                    const isFinalStatus = formDataExtended.status === 'Entregue' || formDataExtended.status === 'Cancelado';

                    if (isOverdue && !isFinalStatus) {
                        formDataExtended.status = 'Atrasado'; 
                    } else if (formDataExtended.status === 'Atrasado' && !isOverdue) {
                        formDataExtended.status = 'Aguardando Envio';
                    }
                    // Atualiza o select do status no formulário caso tenha mudado
                    document.getElementById('item-status').value = formDataExtended.status;

                    // Se o status for Entregue, marca como arquivado automaticamente
                    if (formDataExtended.status === 'Entregue') {
                        formDataExtended.archived = true;
                    }

                    const index = state.purchases.findIndex(item => item.id === editId);
                    if (index !== -1) {
                        // Atualiza o item localmente com todos os novos dados
                        state.purchases[index] = { 
                            ...state.purchases[index], 
                            ...formDataExtended,
                            updatedAt: firebase.database.ServerValue.TIMESTAMP 
                        };
                        
                        // Salva no Firebase e força atualização imediata da interface
                        try {
                            await savePurchasesToStorage();
                            sortPurchases(); // Reordena a lista se necessário
                            renderList(); // Força atualização da UI
                            showToast('Compra atualizada com sucesso!');
                        } catch (error) {
                            console.error('Erro ao atualizar compra:', error);
                            showToast('Erro ao atualizar compra', 'bg-red-500');
                        }
                    }
                } else {
                    const newItem = {
                        id: Date.now().toString(),
                        ...formDataExtended,
                        createdAt: firebase.database.ServerValue.TIMESTAMP
                    };
                    state.purchases.push(newItem);
                    await savePurchasesToStorage();
                    showToast('Compra adicionada com sucesso!');
                }

                sortPurchases(); // Ordena a lista
                closeModal();
            }

            /**
             * (*** ATUALIZADO ***)
             * Manipula cliques na lista (Editar/Excluir/Entregue/Arquivar)
             */
            async function handleListActions(e) {
                const target = e.target;
                const editBtn = target.closest('.edit-btn');
                const deleteBtn = target.closest('.delete-btn');
                const deliverBtn = target.closest('.deliver-btn');
                const archiveBtn = target.closest('.archive-btn');

                if (editBtn) {
                    const id = editBtn.dataset.id;
                    const item = state.purchases.find(p => p.id === id);
                    if (item) {
                        openModal(item); 
                    }
                }

                if (deleteBtn) {
                    const id = deleteBtn.dataset.id;
                    state.purchases = state.purchases.filter(p => p.id !== id);
                    try {
                        await savePurchasesToStorage();
                        showToast('Compra excluída.', 'bg-red-500');
                    } catch (error) {
                        console.error('Erro ao excluir compra:', error);
                        showToast('Erro ao excluir compra', 'bg-red-500');
                    }
                }

                // Manipula o botão de arquivar
                if (archiveBtn) {
                    const id = archiveBtn.dataset.id;
                    const index = state.purchases.findIndex(p => p.id === id);
                    
                    if (index !== -1) {
                        state.purchases[index].archived = true;
                        try {
                            await savePurchasesToStorage();
                            showToast('Compra arquivada!', 'bg-gray-500');
                            renderList();
                        } catch (error) {
                            console.error('Erro ao arquivar:', error);
                            showToast('Erro ao arquivar compra', 'bg-red-500');
                        }
                    }
                }

                // (NOVO) Manipulador do botão "Entregue"
                if (deliverBtn) {
                    const id = deliverBtn.dataset.id;
                    const index = state.purchases.findIndex(p => p.id === id);
                    if (index !== -1) {
                        // Atualiza o status e marca como arquivado automaticamente
                        state.purchases[index] = {
                            ...state.purchases[index],
                            status: 'Entregue',
                            archived: true,
                            updatedAt: firebase.database.ServerValue.TIMESTAMP
                        };
                        sortPurchases(); // Re-ordena (item vai para o fim)
                        try {
                            await savePurchasesToStorage();
                            showToast('Compra marcada como entregue e arquivada!', 'bg-green-500');
                        } catch (error) {
                            console.error('Erro ao marcar como entregue:', error);
                            showToast('Erro ao marcar como entregue', 'bg-red-500');
                        }
                    }
                }
            }
            
            /**
             * Manipula o clique nos botões de filtro (pills)
             */
            function handleFilterClick(e) {
                const target = e.target.closest('button.filter-pill');
                
                if (!target) return;

                const newFilter = target.dataset.filter;

                if (newFilter === state.filter) return;

                state.filter = newFilter;

                const buttons = filterContainer.querySelectorAll('button.filter-pill');
                
                const inactiveClasses = ['bg-white', 'text-gray-600', 'border-gray-200', 'hover:bg-gray-50', 'hover:shadow-sm'];
                const classesToRemove = [
                    'bg-teal-600', 'text-white', 'border-transparent', 'shadow',
                    'bg-green-100', 'text-green-800',
                    'bg-cyan-100', 'text-cyan-800', 'font-bold',
                    'bg-orange-100', 'text-orange-800', 'font-bold', // Atualizado para Laranja
                    'bg-red-100', 'text-red-800',
                    'bg-purple-100', 'text-purple-800', 'font-bold'
                ];

                buttons.forEach(btn => {
                    btn.classList.remove(...classesToRemove);
                    btn.classList.add(...inactiveClasses);
                });

                target.classList.remove(...inactiveClasses);
                
                if (newFilter === 'todos') {
                    target.classList.add('bg-teal-600', 'text-white', 'border-transparent', 'shadow');
                } else {
                    // Usa a classe do badge para colorir o filtro
                    const { statusClass } = getStatusInfo(newFilter);
                    target.classList.add(...statusClass.split(' '), 'border-transparent', 'shadow');
                }
                
                renderList();
            }

            /**
             * Abre o modal.
             */
            function openModal(item = null) {
                form.reset(); 

                if (item) {
                    modalTitle.textContent = 'Editar Compra';
                    editIdInput.value = item.id;
                    document.getElementById('item-name').value = item.name;
                    document.getElementById('store-name').value = item.store;
                    document.getElementById('purchase-date').value = item.purchaseDate;
                    document.getElementById('delivery-date').value = item.deliveryDate;
                    document.getElementById('item-status').value = item.status;
                    document.getElementById('tracking-code').value = item.trackingCode;
                    document.getElementById('tracking-type').value = item.trackingType || 'correios';
                    document.getElementById('order-link').value = item.orderLink || '';
                    
                    // Lógica para marcar o radio button correto
                    const iconId = `icon-${item.icon || 'caixa'}`;
                    const iconRadio = document.getElementById(iconId);
                    if (iconRadio) {
                        iconRadio.checked = true;
                    } else {
                        document.getElementById('icon-caixa').checked = true; // Fallback
                    }

                    // Salva os valores para uso futuro
                    state.lastUsedValues = {
                        ...state.lastUsedValues,
                        store: item.store,
                        trackingType: item.trackingType || state.lastUsedValues.trackingType,
                        icon: item.icon || state.lastUsedValues.icon
                    };
                } else {
                    modalTitle.textContent = 'Nova Compra';
                    editIdInput.value = '';
                    const today = getTodayDate();
                    document.getElementById('purchase-date').value = today;
                    
                    // Usa os últimos valores como padrão
                    document.getElementById('store-name').value = '';
                    document.getElementById('tracking-type').value = state.lastUsedValues.trackingType;
                    
                    const iconId = `icon-${state.lastUsedValues.icon}`;
                    const iconRadio = document.getElementById(iconId);
                    if (iconRadio) {
                        iconRadio.checked = true;
                    } else {
                        document.getElementById('icon-caixa').checked = true;
                    }
                }

                modal.classList.remove('hidden');
                requestAnimationFrame(() => {
                     modal.classList.add('modal-fade-enter-active');
                     modal.classList.remove('modal-fade-enter');
                });
            }

            /**
             * Fecha o modal e reseta o formulário
             */
            function closeModal() {
                modal.classList.add('modal-fade-leave-active');
                modal.classList.remove('modal-fade-enter-active');
                
                setTimeout(() => {
                    modal.classList.add('hidden');
                    modal.classList.remove('modal-fade-leave-active');
                    modal.classList.add('modal-fade-enter');
                    form.reset();
                    editIdInput.value = '';
                }, 200); 
            }

            /**
             * Cria um backup dos dados atuais diretamente no Firebase
             */
            async function createBackup() {
                try {
                    // Obtém os dados atuais
                    const snapshot = await db.ref('purchases').once('value');
                    const data = snapshot.val();
                    
                    // Cria o objeto de backup com metadata
                    const backup = {
                        data: data || {},
                        timestamp: firebase.database.ServerValue.TIMESTAMP,
                        version: '1.0',
                        date: new Date().toISOString()
                    };
                    
                    // Salva o backup no Firebase
                    await db.ref('backups').push(backup);
                    
                    showToast('Backup criado com sucesso!', 'bg-blue-500');
                } catch (error) {
                    console.error('Erro ao criar backup:', error);
                    showToast('Erro ao criar backup', 'bg-red-500');
                }
            }

            /**
             * Abre o modal de restauração e carrega a lista de backups
             */
            async function openRestoreModal() {
                const restoreModal = document.getElementById('restore-modal');
                const backupsList = document.getElementById('backups-list');
                const noBackups = document.getElementById('no-backups');
                
                try {
                    // Busca todos os backups
                    const snapshot = await db.ref('backups').orderByChild('timestamp').once('value');
                    const backups = snapshot.val();
                    
                    if (!backups) {
                        backupsList.innerHTML = '';
                        noBackups.classList.remove('hidden');
                        backupsList.classList.add('hidden');
                    } else {
                        noBackups.classList.add('hidden');
                        backupsList.classList.remove('hidden');
                        
                        // Converte o objeto em array e reverte para mostrar mais recentes primeiro
                        const backupsArray = Object.entries(backups).reverse();
                        
                        backupsList.innerHTML = backupsArray.map(([key, backup]) => {
                            const date = new Date(backup.timestamp).toLocaleString();
                            const itemCount = Object.keys(backup.data || {}).length;
                            
                            return `
                                <div class="bg-gray-50 rounded-lg p-4 flex items-center justify-between">
                                    <div>
                                        <div class="font-medium text-gray-900">Backup de ${date}</div>
                                        <div class="text-sm text-gray-500">${itemCount} ${itemCount === 1 ? 'item' : 'itens'}</div>
                                    </div>
                                    <div class="flex gap-2">
                                        <button 
                                            data-action="restore"
                                            data-id="${key}"
                                            class="flex items-center gap-2 px-4 py-2 bg-purple-500 text-white rounded-lg hover:bg-purple-600 transition-colors">
                                            <i class="fa-solid fa-clock-rotate-left w-4 h-4"></i>
                                            Restaurar
                                        </button>
                                        <button 
                                            data-action="delete"
                                            data-id="${key}"
                                            class="flex items-center gap-2 px-4 py-2 bg-red-500 text-white rounded-lg hover:bg-red-600 transition-colors">
                                            <i class="fa-solid fa-trash w-4 h-4"></i>
                                        </button>
                                    </div>
                                </div>
                            `;
                        }).join('');
                    }
                    
                    // Mostra o modal
                    restoreModal.classList.remove('hidden');
                    requestAnimationFrame(() => {
                        restoreModal.classList.add('modal-fade-enter-active');
                        restoreModal.classList.remove('modal-fade-enter');
                    });
                    
                } catch (error) {
                    console.error('Erro ao carregar backups:', error);
                    showToast('Erro ao carregar backups', 'bg-red-500');
                }
            }

            /**
             * Restaura um backup específico
             */
            async function restoreBackup(backupId) {
                try {
                    // Confirma com o usuário
                    if (!confirm('Tem certeza que deseja restaurar este backup? Os dados atuais serão substituídos.')) {
                        return;
                    }
                    
                    // Busca o backup
                    const snapshot = await db.ref(`backups/${backupId}`).once('value');
                    const backup = snapshot.val();
                    
                    if (!backup || !backup.data) {
                        throw new Error('Backup inválido');
                    }
                    
                    // Restaura os dados
                    await db.ref('purchases').set(backup.data);
                    
                    // Fecha o modal
                    closeRestoreModal();
                    
                    showToast('Backup restaurado com sucesso!', 'bg-green-500');
                } catch (error) {
                    console.error('Erro ao restaurar backup:', error);
                    showToast('Erro ao restaurar backup', 'bg-red-500');
                }
            }

            /**
             * Fecha o modal de restauração
             */
            function closeRestoreModal() {
                const restoreModal = document.getElementById('restore-modal');
                restoreModal.classList.add('modal-fade-leave-active');
                restoreModal.classList.remove('modal-fade-enter-active');
                
                setTimeout(() => {
                    restoreModal.classList.add('hidden');
                    restoreModal.classList.remove('modal-fade-leave-active');
                    restoreModal.classList.add('modal-fade-enter');
                }, 200);
            }

            // --- Funções Utilitárias ---

            /**
             * Retorna a data local de hoje no formato YYYY-MM-DD
             */
            function getTodayDate() {
                const today = new Date();
                const year = today.getFullYear();
                const month = (today.getMonth() + 1).toString().padStart(2, '0'); // Mês é 0-indexado
                const day = today.getDate().toString().padStart(2, '0');
                return `${year}-${month}-${day}`;
            }

            /**
             * Ordena a lista por prioridade de status e data
             */
            function sortPurchases() {
                const getStatusPriority = (status) => {
                    switch (status) {
                        case 'Atrasado': return 1; // Mais importante
                        case 'Em Trânsito': return 2;
                        case 'Aguardando Envio': return 3;
                        case 'Entregue': return 4;
                        case 'Cancelado': return 5;
                        default: return 6;
                    }
                };

                state.purchases.sort((a, b) => {
                    const priorityA = getStatusPriority(a.status);
                    const priorityB = getStatusPriority(b.status);

                    // 1. Ordena por prioridade de status
                    if (priorityA !== priorityB) {
                        return priorityA - priorityB;
                    }

                    // 2. Se a prioridade for a mesma:
                    // Para itens ativos (prioridade < 4), ordena pela data de entrega mais próxima (ascendente)
                    if (priorityA < 4) { 
                        return new Date(a.deliveryDate) - new Date(b.deliveryDate);
                    } else {
                    // Para itens finalizados (Entregue, Cancelado), ordena pela data mais recente (descendente)
                        return new Date(b.deliveryDate) - new Date(a.deliveryDate);
                    }
                });
            }

            /**
             * Calcula a diferença de dias (Date1 - Date2)
             */
            function calculateDaysDifference(dateStr1, dateStr2) {
                const date1 = new Date(dateStr1 + 'T00:00:00');
                const date2 = new Date(dateStr2 + 'T00:00:00');
                const diffTime = date1.getTime() - date2.getTime();
                const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
                return diffDays;
            }

            function formatDate(dateString) {
                if (!dateString) return 'N/A';
                const [year, month, day] = dateString.split('-');
                return `${day}/${month}/${year}`;
            }

            function getDayOfWeek(dateString) {
                if (!dateString) return '';
                const date = new Date(dateString + 'T00:00:00');
                const days = ['Domingo', 'Segunda', 'Terça', 'Quarta', 'Quinta', 'Sexta', 'Sábado'];
                return days[date.getDay()];
            }
