            /**
             * Gera o menu de opções de status, excluindo o status atual
             * @param {string} currentStatus - Status atual do item
             * @returns {string} HTML do menu de opções
             */
            function generateStatusOptions(currentStatus, itemId) {
                const allStatuses = [
                    'Aguardando Envio',
                    'Em Trânsito',
                    'Atrasado',
                    'Entregue',
                    'Cancelado'
                ];
                
                // Filtra o status atual
                const availableStatuses = allStatuses.filter(status => status !== currentStatus);
                
                return availableStatuses.map(status => {
                    const { statusClass, statusText } = getStatusInfo(status);
                    return `
                        <button class="status-option w-full text-left px-3 py-2 text-sm hover:bg-gray-50 transition-colors border-b border-gray-50 last:border-b-0 ${statusClass}"
                                data-status="${status}"
                                data-id="${itemId}">
                            ${statusText}
                        </button>
                    `;
                }).join('');
            }

            /**
             * Retorna classes e texto para o STATUS (badge)
             * @param {string} status
             * @returns {object}
             */
            function getStatusInfo(status) {
                switch (status) {
                    case 'Entregue':
                        return { statusClass: 'bg-green-100 text-green-800', statusText: 'Entregue' };
                    case 'Em Trânsito':
                        return { statusClass: 'bg-cyan-100 text-cyan-800 font-bold', statusText: 'Em Trânsito' };
                    case 'Atrasado':
                        // Cor alterada para Laranja para maior alerta
                        return { statusClass: 'bg-orange-100 text-orange-800 font-bold', statusText: 'Atrasado' };
                    case 'Cancelado':
                        return { statusClass: 'bg-red-100 text-red-800', statusText: 'Cancelado' };
                    case 'Aguardando Envio':
                    default:
                        return { statusClass: 'bg-purple-100 text-purple-800 font-bold', statusText: 'Aguard. Envio' };
                }
            }

            function escapeHTML(str) {
                if (typeof str !== 'string') return '';
                return str.replace(/[&<>"']/g, (match) => {
                    const map = {
                        '&': '&amp;',
                        '<': '&lt;',
                        '>': '&gt;',
                        '"': '&quot;',
                        "'": '&#39;'
                    };
                    return map[match];
                });
            }
            
            /**
             * Controla o carrossel de ícones
             * @param {number} direction - Direção do scroll (-1 para esquerda, 1 para direita)
             */
            function setupCarousel() {
                const container = document.getElementById('icon-carousel-content');
                const prevBtn = document.getElementById('carousel-prev');
                const nextBtn = document.getElementById('carousel-next');
                const itemWidth = 56; // Largura de um item (3.5rem)
                const itemsPerPage = 5; // Número de itens visíveis por vez
                const scrollAmount = itemWidth * itemsPerPage; // Scroll de 5 itens por vez

                function scrollCarousel(direction) {
                    const currentScroll = container.scrollLeft;
                    let targetScroll = currentScroll + (scrollAmount * direction);

                    // Calcula o máximo de scroll possível
                    const maxScroll = container.scrollWidth - container.clientWidth;

                    // Se chegamos ao final, voltamos ao início
                    if (targetScroll > maxScroll) {
                        targetScroll = 0;
                    }
                    // Se estamos no início e voltamos, vamos para o final
                    else if (targetScroll < 0) {
                        // Ajusta para o último grupo completo de itens
                        targetScroll = Math.floor(maxScroll / scrollAmount) * scrollAmount;
                        if (targetScroll < maxScroll) {
                            targetScroll = maxScroll;
                        }
                    }

                    container.scrollTo({
                        left: targetScroll,
                        behavior: 'smooth'
                    });
                }

                prevBtn.addEventListener('click', () => scrollCarousel(-1));
                nextBtn.addEventListener('click', () => scrollCarousel(1));
            }

            /**
             * Atualiza a lista de sugestões de tipos de rastreio
             */
            async function updateTrackingTypeSuggestions() {
                const customTypes = await firebaseService.getCustomTrackingTypes();
                const datalist = document.getElementById('tracking-type-suggestions');
                
                // Limpa a lista atual
                datalist.innerHTML = '';
                
                // Adiciona os tipos personalizados como opções
                customTypes.forEach(type => {
                    const option = document.createElement('option');
                    option.value = type;
                    datalist.appendChild(option);
                });

                // Atualiza também o select principal
                const trackingTypeSelect = document.getElementById('tracking-type');
                const currentValue = trackingTypeSelect.value;
                
                // Remove opções personalizadas antigas
                Array.from(trackingTypeSelect.options).forEach(option => {
                    if (!['correios', 'jtexpress', 'outro'].includes(option.value)) {
                        trackingTypeSelect.removeChild(option);
                    }
                });

                // Adiciona os tipos personalizados como opções no select
                customTypes.forEach(type => {
                    const exists = Array.from(trackingTypeSelect.options).some(opt => opt.value === type);
                    if (!exists) {
                        const option = document.createElement('option');
                        option.value = type;
                        option.textContent = type;
                        // Insere antes da opção "Outro"
                        const outroOption = Array.from(trackingTypeSelect.options).find(opt => opt.value === 'outro');
                        trackingTypeSelect.insertBefore(option, outroOption);
                    }
                });

                // Restaura o valor selecionado
                trackingTypeSelect.value = currentValue;
            }

            // Função para ajustar tamanho da fonte para caber em uma linha
            function adjustTextSize() {
                document.querySelectorAll('.fit-text').forEach(element => {
                    const maxSize = parseInt(element.dataset.maxSize) || 16;
                    const minSize = parseInt(element.dataset.minSize) || 12;
                    let size = maxSize;
                    
                    element.style.whiteSpace = 'nowrap';
                    element.style.fontSize = size + 'px';
                    
                    while (element.scrollWidth > element.offsetWidth && size > minSize) {
                        size--;
                        element.style.fontSize = size + 'px';
                    }
                });
            }

            // Função para reajustar textos quando necessário
            const resizeObserver = new ResizeObserver(entries => {
                adjustTextSize();
            });

            // --- Inicializa a Aplicação ---
            async function init() {
                setupCarousel();
                addEventListeners();
                await loadPurchasesFromStorage();
                await updateTrackingTypeSuggestions(); // Carrega os tipos de rastreio personalizados
                
                // Inicia o observador de redimensionamento para os títulos
                document.querySelectorAll('.fit-text').forEach(element => {
                    resizeObserver.observe(element);
                });
                adjustTextSize();
            }

            init();
        });
